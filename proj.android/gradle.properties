# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM 内存，避免大项目 OOM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 并行构建
org.gradle.parallel=true

# 开启构建缓存
org.gradle.caching=true

android.useAndroidX=false
android.enableJetifier=false

# 测试机：Android 7.1.2（API 25）
# compileSdkVersion 用本机已安装的最低版本 35（只影响编译期 API 可见性，不影响运行行为）
PROP_COMPILE_SDK_VERSION=35

# minSdk 与测试机 API 对齐，确保不会因 minSdk > 设备版本而拒绝安装
PROP_MIN_SDK_VERSION=21

# 以测试机版本为 target，避免高版本新行为影响调试
PROP_TARGET_SDK_VERSION=25

# 只编译 armeabi-v7a，测试机是 32 位 ARM，加快构建速度
PROP_APP_ABI=armeabi-v7a

# 使用 CMake 构建 native 代码（与根目录 CMakeLists.txt 对应）
PROP_BUILD_TYPE=cmake

# release 签名（暂不配置，仅 debug 包调试用）
#RELEASE_STORE_FILE=file path of keystore
#RELEASE_STORE_PASSWORD=password of keystore
#RELEASE_KEY_ALIAS=alias of key
#RELEASE_KEY_PASSWORD=password of key

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
